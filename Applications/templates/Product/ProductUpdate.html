<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #e0eafc, #cfdef3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        section {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button,
        .cancel-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            text-align: center;
        }

        button {
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        .cancel-button {
            background: #dc3545;
            color: white;
            text-decoration: none;
        }

        .cancel-button:hover {
            background: #c82333;
        }

        @media (max-width: 480px) {
            section {
                padding: 30px 20px;
            }

            h2 {
                font-size: 20px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <section>
        <h2>Update Product</h2>
        <form action="{{ url_for('editProduct', productname=product.product_Name) }}" method="post">
            <label for="product-name">Name</label>
            <input type="text" id="product-name" name="product-name" value="{{ product.product_Name }}" readonly>

            <label for="product-price">Price</label>
            <input type="number" id="product-price" name="product-price" value="{{ product.product_Price }}" required>

            <label for="product-quantity">Quantity</label>
            <input type="number" id="product-quantity" name="product-quantity" value="{{ product.product_Quantity }}" required>

            <div class="button-group">
                <button type="submit">Update</button>
                <a href="/product" class="cancel-button">Cancel</a>
            </div>
        </form>
    </section>
</body>
</html>
