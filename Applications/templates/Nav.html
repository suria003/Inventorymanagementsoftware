                role="button" aria-label="Logout">

                        stroke-linecap="round" stroke-linejoin="round" />

        <!-- PROFILE JS API -->
        <script>
            async function profile() {
                const errElem = document.getElementById('md-error-msg');
                if (errElem) {
                    errElem.style.display = 'none';
                    errElem.textContent = '';
                }

                try {
                    const API = "http://127.0.0.1:3000/profile";
                    const response = await fetch(API, {
                        method: 'GET',
                        credentials: 'include'
                    });
                    const result = await response.json();

                    if (response.ok) {
                        const initialEl = document.getElementById('md-initial');
                        const displayNameEl = document.getElementById('md-display-name');
                        const usernameEl = document.getElementById('md-username');
                        const locationEl = document.getElementById('md-location');

                        const user = result.user || {};

                        if (initialEl) initialEl.innerText = user.name ? user.name[0] : '';
                        if (displayNameEl) displayNameEl.innerText = user.name || '';
                        if (usernameEl) usernameEl.innerText = user.username || '';
                        if (locationEl) locationEl.innerText = user.location || '';

                    } else if (response.status === 404) {
                        if (errElem) {
                            errElem.style.display = 'block';
                            errElem.textContent = result.message || 'Profile not found';
                        }
                    } else {
                        if (errElem) {
                            errElem.style.display = 'block';
                            errElem.textContent = result.message || `Request failed (${response.status})`;
                        }
                    }
                } catch (err) {
                    if (errElem) {
                        errElem.style.display = 'block';
                        errElem.textContent = err.message || 'An unexpected error occurred';
                    }
                    console.error('Profile fetch error:', err);
                }
            }

            window.addEventListener('load', profile);
        </script>

        <script>
            (function() {
                const profileBtn = document.getElementById('profile-btn');
                const panel = document.getElementById('md-panel');
                const overlay = document.getElementById('md-overlay');
                const closeBtn = document.getElementById('md-close');

                const PANEL_HIDDEN_RIGHT = '-380px';
                const PANEL_VISIBLE_RIGHT = '0px';

                function showPanel() {
                    panel.style.right = PANEL_VISIBLE_RIGHT;
                    panel.style.transform = 'translateY(0)';
                    overlay.style.opacity = '1';
                    overlay.style.pointerEvents = 'auto';
                    profileBtn.setAttribute('aria-expanded', 'true');
                    panel.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                }

                function hidePanel() {
                    panel.style.right = PANEL_HIDDEN_RIGHT;
                    panel.style.transform = 'translateY(0)';
                    overlay.style.opacity = '0';
                    overlay.style.pointerEvents = 'none';
                    profileBtn.setAttribute('aria-expanded', 'false');
                    panel.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                }

                if (profileBtn) {
                    profileBtn.addEventListener('click', (e) => {
                        const isOpen = profileBtn.getAttribute('aria-expanded') === 'true';
                        if (isOpen) hidePanel();
                        else showPanel();
                    });

                    profileBtn.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            profileBtn.click();
                        } else if (e.key === 'Escape') hidePanel();
                    });
                }

                overlay.addEventListener('click', hidePanel);

                if (closeBtn) closeBtn.addEventListener('click', hidePanel);

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') hidePanel();
                });

                window.addEventListener('resize', () => {
                    if (window.innerWidth < 420) {
                        panel.style.width = '100%';
                        panel.style.right = panel.style.right === PANEL_VISIBLE_RIGHT ? '0px' : PANEL_HIDDEN_RIGHT;
                    } else {
                        panel.style.width = '320px';
                    }
                });

                if (profileBtn) profileBtn.setAttribute('aria-expanded', 'false');
                panel.setAttribute('aria-hidden', 'true');
            })();
        </script>
